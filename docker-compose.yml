# docker-compose:用一个文件描述"怎么跑这些容器",之后一条 docker compose up 就能启动。
# 相比每次敲一长串 docker run 参数,compose 更适合日常开发和部署。
#
# ⚠️ 已有数据库的迁移提醒(切换到非 root 应用账号)
# 下面 mysql 服务的 MYSQL_USER/MYSQL_PASSWORD 只在"数据目录为空的首次初始化"时生效。
# 如果数据卷里已经有数据(线上环境就是这种情况),这两个变量不会补建账号,
# 需要手动执行一次下面的 SQL(把 <APP_PASSWORD> 换成 .env 里 MYSQL_PASSWORD 的值):
#
#   docker compose exec mysql mysql -uroot -p
#   CREATE USER IF NOT EXISTS 'justdoit_app'@'%' IDENTIFIED BY '<APP_PASSWORD>';
#   GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, INDEX, ALTER, REFERENCES
#     ON personal_ai.* TO 'justdoit_app'@'%';
#   FLUSH PRIVILEGES;
#
# 注意只授到 personal_ai.* 这一个库,且不给 DROP / GRANT OPTION / SUPER。
# 保留 CREATE/INDEX/ALTER 是因为应用启动时会跑 SQLModel.metadata.create_all 建表。
# 账号建好后再把 .env 的 MYSQL_USER 从 root 改成 justdoit_app 并重启 backend。
#
# ⚠️ 另外:MySQL 官方镜像不接受 MYSQL_USER=root(首次初始化时会直接报错退出)。
# 所以在删除数据卷重新初始化之前,务必先把 .env 的 MYSQL_USER 改成非 root 值。

services:
  # ============ 反向代理(Nginx)============
  # 唯一对公网开放的服务。所有外部请求先到这里,再转发给 backend。
  # 好处:后端和数据库面板都退回 compose 内网,公网扫描器打不到;
  # TLS 证书只配在这一处,应用代码不用关心加解密。
  nginx:
    image: nginx:1.27-alpine
    container_name: personal-ai-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 挂载整个 conf.d 目录(而不是单个文件):镜像自带的 default.conf 会被
      # 一起顶掉,否则它和我们的 server 块会抢 80 端口的 default_server。
      # :ro 只读,容器内进程改不了宿主机上的配置。
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
    restart: unless-stopped

  # ============ 后端服务(FastAPI)============
  backend:
    # 用当前目录下的 Dockerfile 构建镜像
    build: .
    # 给容器起个名字,方便查看和管理
    container_name: personal-ai-backend
    # 不再向宿主机映射 8000。expose 只声明"容器内监听哪个端口",
    # 让同一 compose 网络里的 nginx 用服务名 backend:8000 访问,
    # 公网无法直连后端——绕过 Nginx 的限流、TLS、日志就不可能了。
    #
    # 本地开发想直连 8000 调试,见 docker-compose.override.yml。
    expose:
      - "8000"
    # 把 .env 文件里的变量注入到容器里(大模型 Key、数据库密码等)
    env_file:
      - .env
    # 让 backend 用 compose 内网访问 mysql,用服务名当主机名(不是 localhost!)。
    # 这两个变量优先级高于 .env,写在这里能保证容器间连通。
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
    # 启动命令沿用 Dockerfile 里的 CMD(不带 --reload),代码固化在镜像里。
    # 本地开发想要"改代码即生效"的热重载,见 docker-compose.override.yml——
    # 那个文件在本机 docker compose up 时会自动叠加,部署时不上传服务器。
    #
    # 为什么生产不能用 --reload + 目录挂载:
    # 1. rsync 推代码时文件是逐个到达的,reloader 可能在只传了一半时就重启,
    #    此时 import 失败,服务会有一段时间 500;
    # 2. 直接在服务器上编辑文件会静默重启生产服务,不留任何痕迹,难排查。
    # 容器异常退出时自动重启(部署到服务器上很有用)
    restart: unless-stopped
    # depends_on 只是控制"启动顺序",默认不会等 MySQL 真正 ready。
    # 加 condition: service_healthy 后,backend 会等 mysql healthcheck 通过再启动,
    # 避免 backend 启动瞬间 MySQL 还没初始化完导致连接被拒。
    #
    # redis 用 service_started 而不是 service_healthy:缓存是 fail-open 的,
    # Redis 没就绪时应用会自动降级为直接查库,不该因此阻塞启动。
    # 这个区别本身就体现了"哪些依赖是必需的、哪些是可选的"。
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  # ============ 缓存(Redis 7)============
  # 只在 compose 内网可见,不映射宿主机端口。
  # 无密码的 Redis 暴露到公网是经典的入侵入口(可以写 crontab、传公钥),
  # 所以这里既不映射端口,也建议在 .env 里配上 REDIS_PASSWORD。
  redis:
    image: redis:7-alpine
    container_name: personal-ai-redis
    command:
      # requirepass 从环境变量注入,不写死在文件里
      - sh
      - -c
      - >-
        redis-server
        --appendonly yes
        --maxmemory 128mb
        --maxmemory-policy allkeys-lru
        ${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # maxmemory + allkeys-lru 是缓存场景的标准配置:
    # 内存到上限时自动淘汰最久未使用的 key,而不是写入失败。
    # 如果不设 maxmemory,Redis 会一直吃内存直到被系统 OOM kill——
    # 这台机器只有 1.7G 内存,必须设上限。
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ============ 数据库(MySQL 8.0)============
  mysql:
    # 官方镜像,arm64/amd64 都有,Mac 和阿里云都能跑
    image: mysql:8.0
    container_name: personal-ai-mysql
    # 不再向宿主机映射 3306。
    # 数据库只在 compose 内网可见(backend/adminer 用服务名 "mysql" 访问),
    # 公网扫描器就打不到它了。本机要用 DBeaver 之类的客户端连库时,
    # 走 adminer 面板,或临时 docker compose exec mysql mysql -uroot -p。
    environment:
      # 从 .env 读取密码;.env 里必须有 MYSQL_ROOT_PASSWORD 和 MYSQL_DATABASE
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      # 官方镜像首次初始化时会自动创建这个账号,
      # 并只授予它 MYSQL_DATABASE 这一个库的权限(不含其他库、不含 GRANT 权限)。
      # backend 用它连库,避免应用层拿着 root 跑——一旦应用被攻破,
      # 影响范围也只限于这个业务库。
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # 让 MySQL 默认用 utf8mb4(能存 emoji 和罕见汉字),避免以后踩编码坑
      LANG: C.UTF-8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 学习期/小内存服务器优化:默认 buffer pool 是 128M,这里显式声明,便于以后调整
      - --innodb-buffer-pool-size=128M
    # 用 named volume 持久化数据,docker compose down 不会丢数据。
    # 需要清库重来时:docker compose down -v(带 -v 才会连数据卷一起删)
    volumes:
      - mysql_data:/var/lib/mysql
    # 健康检查:每 5 秒执行一次 mysqladmin ping,连续成功才算 healthy。
    # backend 就靠这个信号来判断"MySQL 已经可以接受连接了"。
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ============ 数据库可视化(Adminer)============
  # 单文件 PHP 面板,可看表、写 SQL。
  # 不再向公网映射端口:数据库面板暴露在公网上等于把库门口的锁交出去
  # (只差一个 root 密码)。需要用时在本机执行:
  #   ssh -i <key> -L 8080:localhost:8080 ubuntu@<server>
  # 然后本机浏览器打开 http://localhost:8080 —— 流量走 SSH 加密隧道,
  # 服务器上不留任何公网端口。
  adminer:
    image: adminer:4
    container_name: personal-ai-adminer
    # 只绑到宿主机 127.0.0.1,外部网卡访问不到,仅供 SSH 隧道使用
    ports:
      - "127.0.0.1:8080:8080"
    # 打开页面后默认服务器填 mysql(compose 服务名),用户名 root,密码就是 .env 里的那个
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      - mysql
    restart: unless-stopped

# ============ 数据卷声明 ============
# named volume 由 docker 统一管理,位置不用关心,跨平台可移植。
volumes:
  mysql_data:
  # Nginx 日志放独立卷,容器重建不丢历史访问日志
  nginx_logs:
  # Redis 开了 appendonly,重启后能恢复缓存(不是必需,但能避免重启后全量穿透)
  redis_data:
