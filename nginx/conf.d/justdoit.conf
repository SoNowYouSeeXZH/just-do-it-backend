# justdoit.conf —— Nginx 反向代理配置
#
# 这个文件被挂载到容器的 /etc/nginx/conf.d/ 下。
# 官方镜像的主配置 nginx.conf 里有一行 `include /etc/nginx/conf.d/*.conf;`,
# 而那行位于 http { } 块内部——所以本文件里既能写 http 级指令(log_format、gzip),
# 也能写 server { } 块。挂载整个 conf.d 目录会顶掉镜像自带的 default.conf,
# 避免两个 default_server 抢 80 端口。
#
# 为什么要在 uvicorn 前面加一层 Nginx:
# 1. 端口收口:只有 Nginx 暴露到公网,后端和数据库面板退回内网,攻击面变小;
# 2. TLS 卸载:证书只配在 Nginx 上,应用代码不用关心加解密;
# 3. 静态与压缩:gzip、缓存头这类活儿交给 C 写的 Nginx,比 Python 进程划算;
# 4. 未来横向扩展:upstream 里加机器就能负载均衡,应用不改一行代码。

# ===== http 级配置 =====

# 不在响应头和错误页里暴露 Nginx 版本号,减少针对特定版本的自动化扫描。
server_tokens off;

# 自定义日志格式,比默认的 main 多两个字段:
# - $request_id:Nginx 为每个请求生成的 32 位十六进制串。它会通过下面的
#   proxy_set_header 传给后端,后端 RequestLoggingMiddleware 校验通过后原样透传,
#   于是 Nginx 日志和应用日志能用同一个 id 串起来(见 app/core/middleware.py)。
# - $upstream_response_time:后端真正处理耗时,和 $request_time(含网络传输)
#   对比可以判断"慢"是慢在应用还是慢在客户端网络。
log_format justdoit '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time '
                    'request_id=$request_id';

# gzip:压缩文本类响应,JSON 接口通常能压到三分之一以下。
gzip on;
gzip_min_length 1k;          # 太小的响应压缩收益不抵 CPU 开销
gzip_comp_level 5;           # 1~9,5 是压缩率和 CPU 的平衡点
gzip_vary on;                # 加 Vary: Accept-Encoding,便于中间缓存正确处理
gzip_proxied any;            # 反向代理场景下也压缩(默认只压直连请求)
gzip_types application/json application/javascript text/css text/plain
           text/xml application/xml;
# 注意:text/event-stream 故意不在上面的列表里。SSE 是长连接流式输出,
# 压缩会引入缓冲,打字机效果会变成"一次性吐出一大段"。

# upstream 块在这里被故意去掉了,原因值得记住:
#
# 开源版 Nginx 只在"配置加载时"解析一次 upstream 里的主机名,然后把 IP 永久缓存。
# 容器化部署下 backend 每次重建都可能换 IP(实测 172.18.0.4 -> 172.18.0.3),
# Nginx 却还在往旧 IP 连,结果是所有接口 502 connect() failed (111: Connection refused),
# 而 backend 自己日志一切正常——排查时极容易怀疑错方向。
# (商业版 Nginx Plus 的 `server ... resolve` 能解决,开源版没有这个指令。)
#
# 解法:声明 Docker 内置 DNS,并在 proxy_pass 里用变量,迫使 Nginx 每次请求都查一次 DNS。
# 见 locations.inc 里的 `set $backend_origin ...`。
#
# 代价:用变量的 proxy_pass 无法配合 upstream 的 keepalive,到后端的连接不再复用。
# 对当前量级可以忽略;真要复用连接,就得保留 upstream 块并在每次重建 backend 后
# 执行 nginx -s reload——多一步人工操作,漏掉就是一次线上事故。这里选稳。

# 127.0.0.11 是 Docker 给每个自定义网络内置的 DNS,负责把服务名解析成容器 IP。
# valid=10s 让解析结果只缓存 10 秒,容器重建后最多 10 秒自动恢复。
# ipv6=off:后端只监听 IPv4,省掉每次多查一条 AAAA 记录。
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# ===== HTTP(80)=====
server {
    listen 80;
    listen [::]:80;
    server_name _;           # 没有域名,用 _ 兜住所有 Host

    access_log /var/log/nginx/access.log justdoit;

    # 请求体上限。默认 1m,这里放宽到 2m:任务描述允许 20000 字符,
    # 加上未来可能的富文本,2m 足够;设上限本身是防大包打满内存/磁盘。
    client_max_body_size 2m;

    include /etc/nginx/conf.d/locations.inc;
}

# ===== HTTPS(443,当前是自签名证书)=====
#
# 自签名证书能完整练习 TLS 配置,但浏览器/手机 App 会因为"签发者不可信"报错。
# 拿到域名并备案后,把 ssl_certificate 换成 Let's Encrypt 签发的证书即可,
# 其余配置一行不用改。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                # HTTP/2 需要 TLS,所以只在这个 server 里开
    server_name _;

    access_log /var/log/nginx/access.log justdoit;
    client_max_body_size 2m;

    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;

    # 只留 TLS 1.2/1.3。1.0/1.1 已被主流浏览器废弃且存在已知弱点。
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;   # 现代做法:让客户端选它更擅长的套件
    # 会话复用:握手是 TLS 里最贵的一步,缓存后重连可以跳过完整握手。
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # HSTS 故意没开。它会告诉浏览器"以后只准用 HTTPS 访问这个站",
    # 一旦在自签名证书阶段下发,浏览器会记住并直接拒绝访问,自己把自己锁死。
    # 换成正式证书后再加:
    # add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/conf.d/locations.inc;
}
